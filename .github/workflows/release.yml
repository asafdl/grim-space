name: Release

on:
  push:
    branches:
      - master

env:
  GODOT_VERSION: "4.7.1"
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

  resolve-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export release version
        id: version
        env:
          RELEASED: ${{ steps.semantic.outputs.new_release_published }}
          RELEASE_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
        run: |
          if [[ "$RELEASED" != "true" || -z "$RELEASE_TAG" ]]; then
            echo "::error::semantic-release did not calculate a release"
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  export:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: [test, resolve-version]
    runs-on: ubuntu-latest
    env:
      GRIM_SPACE_VERSION: ${{ needs.resolve-version.outputs.version }}
      DISCORD_ISSUE_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUE_WEBHOOK_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows Desktop
            artifact: windows
            output_path: builds/windows/grim-space.exe
          - preset: Linux/X11
            artifact: linux
            output_path: builds/linux/grim-space.x86_64
          - preset: macOS
            artifact: macos
            output_path: builds/macos/grim-space.zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Import project
        run: godot --headless --import

      - name: Export
        run: |
          mkdir -p "$(dirname "${{ matrix.output_path }}")"
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output_path }}"

      - name: Mark Linux binary executable
        if: matrix.artifact == 'linux'
        run: chmod +x "${{ matrix.output_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: builds/${{ matrix.artifact }}/
          if-no-files-found: error

  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist

      - name: Package release archives
        run: |
          mkdir -p release-assets
          (cd dist/linux && zip -r ../../release-assets/grim-space-linux-x86_64.zip .)
          (cd dist/windows && zip -r ../../release-assets/grim-space-windows-x86_64.zip .)
          cp dist/macos/grim-space.zip release-assets/grim-space-macos.zip

      - name: Create release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
