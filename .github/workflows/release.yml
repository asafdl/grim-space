name: Release

on:
  push:
    branches:
      - master

env:
  GODOT_VERSION: "4.7.1"
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

  export:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows Desktop
            artifact: windows
            output_path: builds/windows/grim-space.exe
          - preset: Linux/X11
            artifact: linux
            output_path: builds/linux/grim-space.x86_64
          - preset: macOS
            artifact: macos
            output_path: builds/macos/grim-space.zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Import project
        run: godot --headless --import

      - name: Generate .NET bindings
        run: godot --headless --build-solutions --quit || exit 0

      - name: Build
        run: dotnet build --configuration Release

      - name: Export
        run: |
          mkdir -p "$(dirname "${{ matrix.output_path }}")"
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output_path }}"

      - name: Mark Linux binary executable
        if: matrix.artifact == 'linux'
        run: chmod +x "${{ matrix.output_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: builds/${{ matrix.artifact }}/
          if-no-files-found: error

  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist

      - name: Package release archives
        run: |
          mkdir -p release-assets
          (cd dist/linux && zip -r ../../release-assets/grim-space-linux-x86_64.zip .)
          (cd dist/windows && zip -r ../../release-assets/grim-space-windows-x86_64.zip .)
          cp dist/macos/grim-space.zip release-assets/grim-space-macos.zip

      - name: Create release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
