name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/core/dfs/native/go.mod
          cache-dependency-path: src/core/dfs/native/go.mod

      - name: Build
        run: dotnet build --configuration Release

      - name: Enable native crash dumps
        run: |
          mkdir -p "$RUNNER_TEMP/grim-space-ci"
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/grim-space-ci/core.%p.%E"
          dotnet --info
          go version

      - name: Test
        id: test
        shell: bash
        run: |
          ulimit -c unlimited
          dotnet test --configuration Release --no-build --output Detailed --show-stdout All \
            2>&1 | tee "$RUNNER_TEMP/grim-space-ci/tests.log"

      - name: Download .NET native symbols
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        shell: bash
        run: |
          if ! command -v dotnet-symbol; then
            dotnet tool install --tool-path "$RUNNER_TEMP/grim-space-ci/tools" \
              --allow-roll-forward dotnet-symbol
            export PATH="$RUNNER_TEMP/grim-space-ci/tools:$PATH"
          fi
          sudo env DOTNET_ROOT="$DOTNET_ROOT" "$(command -v dotnet-symbol)" --symbols \
            "$DOTNET_ROOT"/shared/Microsoft.NETCore.App/10.0.*/libcoreclr.so \
            "$DOTNET_ROOT"/shared/Microsoft.NETCore.App/10.0.*/libclrjit.so

      - name: Print native crash stacks
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        shell: bash
        env:
          DEBUGINFOD_URLS: https://debuginfod.ubuntu.com
        run: |
          shopt -s nullglob
          cores=("$RUNNER_TEMP"/grim-space-ci/core.*)
          if [ "${#cores[@]}" -eq 0 ]; then
            echo "::warning::No native core dump was produced; inspect the detailed test log."
            exit 0
          fi
          if ! command -v gdb; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gdb
          fi
          for core in "${cores[@]}"; do
            name="${core##*/}"
            name="${name#core.}"
            executable="${name#*.}"
            executable="${executable//!//}"
            echo "::group::Native crash stack: $executable"
            gdb --batch --quiet "$executable" "$core" \
              -iex "set debuginfod enabled on" \
              -ex "set pagination off" \
              -ex "info registers" \
              -ex 'p $_siginfo' \
              -ex "info proc mappings" \
              -ex "info threads" \
              -ex "thread apply all bt 40" \
              2>&1 | tee "$core.backtrace.txt"
            echo "::endgroup::"
          done

      - name: Upload failure diagnostics
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-diagnostics
          path: |
            ${{ runner.temp }}/grim-space-ci/tests.log
            ${{ runner.temp }}/grim-space-ci/*.backtrace.txt
          retention-days: 7
